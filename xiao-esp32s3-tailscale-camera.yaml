esphome:
  name: xiao-esp32s3-tailscale-camera
  friendly_name: XIAO ESP32-S3 Tailscale Camera

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "6144"
      CONFIG_LWIP_CHECK_THREAD_SAFETY: y
      CONFIG_LWIP_TCPIP_CORE_LOCKING: n

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

i2c:
  id: camera_i2c
  sda: GPIO40
  scl: GPIO39
  scan: false

esp32_camera:
  name: XIAO Camera
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_id: camera_i2c
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13
  resolution: 640x480
  jpeg_quality: 12
  frame_buffer_location: PSRAM
  frame_buffer_count: 2
  max_framerate: 10 fps
  idle_framerate: 0.1 fps

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

time:
  - platform: sntp
    id: tailscale_time

external_components:
  - source:
      type: git
      url: https://github.com/Csontikka/esphome-tailscale.git
      ref: v0.5.31
    components: [tailscale]
    refresh: 1d

binary_sensor:
  - platform: tailscale
    connected:
      name: Tailscale Connected

text_sensor:
  - platform: tailscale
    ip_address:
      name: Tailscale IP

tailscale:
  auth_key: !secret tailscale_auth_key
  hostname: xiao-camera
